<VirtualHost *:80>
    ServerAdmin webmaster@dummy-host2.example.com
    # Domaine unique : vitrine à la racine, application sous /app/
    DocumentRoot "/var/www/html/site"
    ServerName qwaipod.fr
    ServerAlias www.qwaipod.fr localhost
    ErrorLog "/var/www/html/webapp/logs/front-error_log"
    CustomLog "/var/www/html/webapp/logs/front-access_log" common

    <Directory "/var/www/html/site">
        AllowOverride All
        Require all granted
    </Directory>

    # Application (build React), servie sous /app/
    Alias /app "/var/www/html/webapp/build"
    <Directory "/var/www/html/webapp/build">
        AllowOverride All
        Require all granted
        # Routage côté client (react-router) : renvoyer index.html
        RewriteEngine On
        RewriteBase /app/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.html [L]
    </Directory>

    # Alias pour l'API
    Alias /api "/var/www/html/webapp/api"
    <Directory "/var/www/html/webapp/api">
        AllowOverride All
        Require all granted
    </Directory>

    # Alias pour les fichiers statiques (podcasts générés)
    Alias /static "/var/www/html/webapp/public/output"
    <Directory "/var/www/html/webapp/public/output">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

services:
  web:
    build:
      context: ./webserver
    container_name: podcast_qwebty
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./webserver:/var/www/html
      - ./apache-config:/etc/apache2/sites-available  # Ajout du volume pour Virtual Hosts
    depends_on:
      - db
    networks:
      - app_network
    command: >
      /bin/bash -c "
      a2ensite *.conf &&
      apachectl -D FOREGROUND"

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?La variable MYSQL_ROOT_PASSWORD doit être définie dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?La variable MYSQL_DATABASE doit être définie dans .env}
      MYSQL_USER: ${MYSQL_USER:?La variable MYSQL_USER doit être définie dans .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?La variable MYSQL_PASSWORD doit être définie dans .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?La variable MYSQL_ROOT_PASSWORD doit être définie dans .env}
    depends_on:
      - db
    networks:
      - app_network

  # Pile IA locale, désactivée par défaut. Démarrage :
  #   docker compose --profile local-ai up -d
  # puis : docker compose exec ollama ollama pull llama3.1:8b
  # Modèles recommandés par service : voir docs/LOCAL_AI.md
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["local-ai"]
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_network

  # Génération d'image via l'API AUTOMATIC1111 (webui2image). Image CUDA :
  # nécessite une carte NVIDIA + nvidia-container-toolkit sur l'hôte Docker.
  # Placer un checkpoint (.safetensors) dans le volume sd_data avant usage.
  stable-diffusion:
    image: universonic/stable-diffusion-webui:latest
    container_name: stable-diffusion
    profiles: ["local-ai"]
    restart: always
    entrypoint: ["/app/entrypoint.sh", "--api", "--listen", "--port", "7860"]
    ports:
      - "7860:7860"
    volumes:
      - sd_data:/app/stable-diffusion-webui/models/Stable-diffusion
    networks:
      - app_network
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  # Synthèse vocale, API compatible OpenAI (/v1/audio/speech). Variante CPU :
  # fonctionne sans GPU, plus lente. Voir docs/LOCAL_AI.md pour la variante GPU.
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: tts
    profiles: ["local-ai"]
    restart: always
    ports:
      - "8880:8880"
    networks:
      - app_network

  # Transcription, API compatible OpenAI (/v1/audio/transcriptions). Variante
  # CPU : fonctionne sans GPU, plus lente. Modèle téléchargé au 1er appel.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    profiles: ["local-ai"]
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - whisper_data:/root/.cache/huggingface
    networks:
      - app_network

volumes:
  db_data:
  ollama_data:
  sd_data:
  whisper_data:

networks:
  app_network:
    driver: bridge
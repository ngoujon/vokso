services:
  web:
    build:
      context: ./webserver
    container_name: vokso_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./webserver:/var/www/html/webapp
      - ./site:/var/www/html/site
      - ./apache-config:/etc/apache2/sites-available  # Ajout du volume pour Virtual Hosts
    depends_on:
      - db
    networks:
      - app_network
    # -D VOKSO_DOCKER : le vhost écoute alors sur *:80 (voir apache-config/vokso.conf).
    command: >
      /bin/bash -c "
      a2dissite 000-default >/dev/null; a2ensite vokso >/dev/null &&
      apachectl -D FOREGROUND -D VOKSO_DOCKER"

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?La variable MYSQL_ROOT_PASSWORD doit être définie dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?La variable MYSQL_DATABASE doit être définie dans .env}
      MYSQL_USER: ${MYSQL_USER:?La variable MYSQL_USER doit être définie dans .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?La variable MYSQL_PASSWORD doit être définie dans .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  # Serveur mail factice pour le développement local : capture tous les mails
  # envoyés par l'API (SMTP sur le port 1025) et les affiche dans une
  # interface web, sans jamais rien envoyer à une vraie boîte mail. À
  # remplacer par un vrai fournisseur SMTP une fois le nom de domaine choisi.
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always
    ports:
      - "8025:8025"
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?La variable MYSQL_ROOT_PASSWORD doit être définie dans .env}
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:

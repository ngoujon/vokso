<VirtualHost 127.0.0.1:8080>
    ServerAdmin webmaster@dummy-host2.example.com
    # IMPORTANT — ARCHITECTURE RÉELLE DU SERVEUR DE PRODUCTION (divergence
    # constatée le 28/09/2026, cause d'une coupure totale du site) :
    # ce VPS mutualise plusieurs domaines derrière nginx, qui termine le TLS
    # et fait reverse proxy vers Apache en local (voir /etc/apache2/ports.conf :
    # "Listen 127.0.0.1:8080", et /etc/nginx/sites-available/vokso.fr.conf :
    # "proxy_pass http://127.0.0.1:8080"). Apache n'écoute donc PAS sur le
    # port 80/443 public. Ni ce reverse proxy ni ce port ne sont décrits
    # ailleurs dans ce dépôt (setup-server.sh suppose encore un Apache en
    # frontal direct) — c'est une configuration serveur faite à la main, hors
    # dépôt. NE PAS repasser ce VirtualHost en "*:80" : scripts/deploy.sh
    # synchronise ce fichier vers le serveur à chaque déploiement, et un
    # mauvais port ici fait retomber Apache sur son DocumentRoot par défaut
    # pour tout le trafic (site cassé, mais `apache2ctl configtest` reste
    # "Syntax OK" puisque rien ne détecte qu'aucune requête ne peut plus
    # jamais atteindre ce vhost).
    # Domaine unique : vitrine à la racine, application sous /app/
    DocumentRoot "/var/www/html/site"
    ServerName vokso.fr
    ServerAlias www.vokso.fr localhost
    ErrorLog "/var/www/html/webapp/logs/front-error_log"
    CustomLog "/var/www/html/webapp/logs/front-access_log" common

    # NOTE : la canonicalisation www -> non-www, la page publique par épisode
    # (/podcast/...) et le sitemap dynamique (/sitemap.xml) sont réglés via
    # site/.htaccess plutôt qu'ici, pour rester actifs même en cas de nouvelle
    # divergence de ce type : un .htaccess sous site/ (AllowOverride All, voir
    # plus bas) est relu à chaque requête directement depuis le code déployé,
    # sans dépendre d'une synchronisation vers un fichier système séparé.

    # ============================================
    # COMPRESSION GLOBALE (gzip/deflate)
    # ============================================
    <IfModule mod_deflate.c>
        # Compression pour contenus texte
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/xml+rss application/atom+xml

        # Compression pour images (WebP, PNG, SVG)
        AddOutputFilterByType DEFLATE image/svg+xml image/png image/jpeg image/webp

        # Éviter compression double pour fichiers déjà compressés
        DeflateCompressionLevel 6
        SetEnvIfNoCase Request_URI \.(?:gif|jpg|jpeg|png|exe|flv|mp4|webp)$ no-gzip dont-vary
    </IfModule>

    # ============================================
    # EN-TÊTES DE CACHE HTTP
    # ============================================
    <IfModule mod_expires.c>
        ExpiresActive On

        # Cache par défaut (24 heures)
        ExpiresDefault "access plus 1 day"

        # HTML : court cache (1 heure) pour détecter mises à jour
        ExpiresByType text/html "access plus 1 hour"

        # CSS et JavaScript : long cache (1 an)
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/javascript "access plus 1 year"

        # Fonts : très long cache (1 an)
        ExpiresByType application/font-woff "access plus 1 year"
        ExpiresByType application/font-woff2 "access plus 1 year"
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType application/x-font-ttf "access plus 1 year"
        ExpiresByType font/ttf "access plus 1 year"

        # Images : long cache (1 an)
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"

        # Fichiers JSON (short cache)
        ExpiresByType application/json "access plus 1 hour"
    </IfModule>

    # ============================================
    # EN-TÊTES DE SÉCURITÉ HTTP
    # ============================================
    <IfModule mod_headers.c>
        # Force HTTPS pour ce domaine et ses sous-domaines (actif uniquement si servi en HTTPS)
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

        # Empêche le navigateur de deviner un type MIME différent du Content-Type déclaré
        Header always set X-Content-Type-Options "nosniff"

        # Interdit l'affichage du site dans une iframe d'un autre domaine (anti-clickjacking)
        Header always set X-Frame-Options "SAMEORIGIN"

        # Limite les informations envoyées dans l'en-tête Referer vers d'autres origines
        Header always set Referrer-Policy "strict-origin-when-cross-origin"

        # Politique de sécurité du contenu : tout en self, 'unsafe-inline' requis pour les
        # scripts/styles inline existants (vitrine + styles inline React), connect-src ouvert
        # vers Sentry pour le suivi d'erreurs
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    </IfModule>

    # ============================================
    # EN-TÊTES DE CACHE VIA mod_headers
    # ============================================
    <IfModule mod_headers.c>
        # Cache-Control par défaut
        Header set Cache-Control "public, max-age=86400"

        # HTML : cache court
        <FilesMatch "\.html?$">
            Header set Cache-Control "public, max-age=3600, must-revalidate"
            Header set Pragma "public"
        </FilesMatch>

        # CSS/JS : cache long avec validation
        <FilesMatch "\.(css|js|woff|woff2|ttf|eot)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
            Header set Pragma "public"
        </FilesMatch>

        # Images : cache long
        <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg|ico)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
            Header set Pragma "public"
        </FilesMatch>

        # JSON : cache court
        <FilesMatch "\.json$">
            Header set Cache-Control "public, max-age=3600, must-revalidate"
        </FilesMatch>

        # Activer ETag pour validation
        Header set ETag "%{UNIQUE_ID}e"
    </IfModule>

    <Directory "/var/www/html/site">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Page 404 personnalisée pour la vitrine (racine du domaine)
    ErrorDocument 404 /404.html

    # Application (build React), servie sous /app/
    Alias /app "/var/www/html/webapp/build"
    <Directory "/var/www/html/webapp/build">
        Options -Indexes
        AllowOverride All
        Require all granted
        # Routage côté client (react-router) : renvoyer index.html
        RewriteEngine On
        RewriteBase /app/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.html [L]
    </Directory>

    # Alias pour l'API
    Alias /api "/var/www/html/webapp/api"
    <Directory "/var/www/html/webapp/api">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Alias pour les fichiers statiques (podcasts générés)
    Alias /static "/var/www/html/webapp/public/output"
    <Directory "/var/www/html/webapp/public/output">
        # Pas de listing : il exposait tous les fichiers générés (responses/...).
        Options -Indexes
        AllowOverride All
        Require all granted

        # Servir les images en WebP si le navigateur les supporte
        <IfModule mod_rewrite.c>
            RewriteEngine On

            # Rediriger vers WebP si disponible et supporté par le navigateur
            RewriteCond %{HTTP_ACCEPT} image/webp
            RewriteCond %{REQUEST_FILENAME}\.webp -f
            RewriteRule (.+)\.png$ $1.webp [T=image/webp,E=accept:webp]

            # Définir le type MIME pour les fichiers WebP
            <IfModule mod_mime.c>
                AddType image/webp .webp
            </IfModule>
        </IfModule>
    </Directory>
</VirtualHost>

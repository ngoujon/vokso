<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vokso — hors ligne</title>
<style>
  :root { color-scheme: light dark; --bg: #f3eee4; --ink: #17140f; --muted: #6b6457; --accent: #f5c400; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14120e; --ink: #f3eee4; --muted: #a59d8e; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; box-sizing: border-box; }
  svg { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; color: var(--muted); max-width: 22rem; }
  button { margin-top: 8px; border: 0; border-radius: 999px; padding: 12px 24px; font: inherit; font-weight: 600;
    background: var(--accent); color: #17140f; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 1024 1024" aria-hidden="true">
    <rect width="1024" height="1024" rx="200" fill="#f5c400"/>
    <g fill="#17140f" transform="translate(512 512) scale(1.18) translate(-512 -512)">
      <rect x="258" y="432" width="52" height="160" rx="26"/><rect x="336" y="352" width="52" height="320" rx="26"/>
      <rect x="414" y="402" width="52" height="220" rx="26"/>
      <g opacity="0.62"><rect x="500" y="362" width="266" height="52" rx="26"/><rect x="500" y="442" width="200" height="52" rx="26"/>
      <rect x="500" y="522" width="266" height="52" rx="26"/><rect x="500" y="602" width="160" height="52" rx="26"/></g>
    </g>
  </svg>
  <h1>Pas de connexion</h1>
  <p>Vokso a besoin d'internet pour charger les épisodes. Vérifiez votre connexion puis réessayez.</p>
  <button type="button" onclick="location.replace('https://vokso.fr/')">Réessayer</button>
</main>
</body>
</html>

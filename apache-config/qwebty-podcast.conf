<VirtualHost *:80>
    ServerAdmin webmaster@dummy-host2.example.com
    DocumentRoot "/var/www/html"
    ServerName podcast.qwebty.local
    ServerAlias localhost
    ErrorLog "/var/www/html/logs/front-error_log"
    CustomLog "/var/www/html/logs/front-access_log" common

    <Directory "/var/www/html">
        AllowOverride All
        Require all granted
    </Directory>

    # Alias pour l'API
    Alias /api "/var/www/html/api"
    <Directory "/var/www/html/api">
        AllowOverride All
        Require all granted
    </Directory>

    # Alias pour les fichiers statiques
    Alias /static "/var/www/html/public/output"
    <Directory "/var/www/html/public/output">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>


<VirtualHost *:80>
    ServerAdmin webmaster@dummy-host2.example.com
    DocumentRoot "/var/www/html"
    ServerName podcast.qwebty.local
    ErrorLog "/var/www/html/logs/front-error_log"
    CustomLog "/var/www/html/logs/front-access_log" common
</VirtualHost>

<VirtualHost *:80>
    ServerAdmin webmaster@dummy-host2.example.com
    DocumentRoot "/var/www/html/api"
    ServerName api-podcast.qwebty.local
    ErrorLog "/var/www/html/logs/api-error_log"
    CustomLog "/var/www/html/logs/api-access_log" common

    <Directory "/var/www/html/api">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerAdmin webmaster@dummy-host2.example.com
    DocumentRoot "/var/www/html/public/output"
    ServerName static-podcast.qwebty.local
    ErrorLog "/var/www/html/logs/static-error_log"
    CustomLog "/var/www/html/logs/static-access_log" common
</VirtualHost>


<IfModule mod_headers.c>
    Header set Access-Control-Allow-Origin "*"
    Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header set Access-Control-Allow-Headers "Content-Type, Authorization"
</IfModule>
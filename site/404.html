<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Vokso</title>
<meta name="description" content="La page que vous cherchez n'existe pas ou plus sur Vokso.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/vokso-icon-180.png">
<style>
  :root {
    --primary-color: #4653d6;
    --accent-color: #ff7a52;
    --bg: #f4f5fa;
    --text: #1a1c29;
    --muted: #5b6172;
    --line: #e3e5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary-color: #5b6ef5;
      --accent-color: #ff8a5b;
      --bg: #0e1016;
      --text: #f7f8fa;
      --muted: #a6adbb;
      --line: #262b36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .wrap { width: min(480px, 100% - 2.5rem); padding: 2rem 0; }
  .brand { display: flex; align-items: center; justify-content: center; gap: .6rem; font-weight: 800; letter-spacing: -0.02em; font-size: 1.1rem; margin-bottom: 2.5rem; }
  .brand .dot {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
    flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .brand .dot svg { width: 62%; height: 62%; }
  h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 .8rem; font-weight: 800; letter-spacing: -0.03em; }
  p { color: var(--muted); margin: 0 0 2rem; }
  .btn {
    display: inline-block; padding: .8rem 1.8rem; border-radius: 999px;
    text-decoration: none; font-weight: 700; border: 1px solid transparent;
    background: var(--primary-color); color: #fff;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="dot" aria-hidden="true">
        <svg viewBox="218 312 588 382" fill="currentColor">
          <rect x="258" y="432" width="52" height="160" rx="26" />
          <rect x="336" y="352" width="52" height="320" rx="26" />
          <rect x="414" y="402" width="52" height="220" rx="26" />
          <rect x="500" y="362" width="266" height="52" rx="26" opacity="0.5" />
          <rect x="500" y="442" width="200" height="52" rx="26" opacity="0.5" />
          <rect x="500" y="522" width="266" height="52" rx="26" opacity="0.5" />
          <rect x="500" y="602" width="160" height="52" rx="26" opacity="0.5" />
        </svg>
      </span>
      Vokso
    </div>
    <h1>404</h1>
    <p>Cette page n'existe pas ou plus.</p>
    <a class="btn" href="/">&larr; Retour à l'accueil</a>
  </div>
</body>
</html>

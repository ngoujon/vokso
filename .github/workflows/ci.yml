name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webserver/package-lock.json

      - name: Installe les dépendances
        working-directory: webserver
        run: npm ci

      - name: Build (react-scripts build)
        working-directory: webserver
        run: npm run build

      - name: Tests
        working-directory: webserver
        run: npm test -- --watchAll=false
        env:
          CI: true

  backend:
    name: Backend PHP (composer + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mysqli, zip

      - name: Installe les dépendances
        working-directory: webserver/api
        run: composer install --prefer-dist --no-progress

      - name: Tests (PHPUnit)
        working-directory: webserver/api
        run: vendor/bin/phpunit
